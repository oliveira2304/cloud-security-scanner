# .github/workflows/ci.yml
#
# What this does:
#   - Runs on every push and PR to main
#   - Lints with ruff (fast Python linter)
#   - Runs all unit tests with moto (no real AWS needed)
#   - Uploads coverage report
#
# Why moto works here:
#   conftest.py injects fake AWS credentials.
#   moto intercepts boto3 calls. No AWS account needed in CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check cloudscan/ tests/

      - name: Run tests with coverage
        run: pytest --cov=cloudscan --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
