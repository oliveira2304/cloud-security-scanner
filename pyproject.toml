[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudscan"
version = "0.1.0"
description = "AWS Cloud Security Scanner — detect misconfigurations in your AWS account"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "boto3>=1.34",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.scripts]
cloudscan = "cloudscan.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3,iam,ec2,cloudtrail,guardduty]>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
